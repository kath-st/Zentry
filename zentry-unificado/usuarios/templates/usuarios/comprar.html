{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header"><h4>Registrar Compra</h4></div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Producto</label>
              <input name="producto" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Monto</label>
              <input name="monto" type="number" step="0.01" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Fecha (opcional)</label>
              <input name="fecha" type="date" class="form-control" />
            </div>
            <div class="d-grid">
              <button class="btn btn-primary">Registrar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
