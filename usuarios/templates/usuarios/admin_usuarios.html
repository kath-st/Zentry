{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Administración de Usuarios</h2>
    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Email</th>
                    <th>Tipo</th>
                    <th>DNI</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for user in usuarios %}
                <tr>
                    <td>{{ user.get_full_name }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.get_tipo_display }}</td>
                    <td>{{ user.dni }}</td>
                    <td>{{ user.telefono }}</td>
                    <td>
                        <a href="{% url 'modificar_usuario' user.id %}" class="btn btn-sm btn-primary">Modificar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
